# The download page for interns: site/ published to GitHub Pages, with the releases
# written beside it as releases.json, so the page always shows the latest installer.
# It republishes when a release is published, edited or deleted, when site/ changes,
# and from the Actions tab (Run workflow).
#
# Once, in the repo on GitHub: Settings → Pages → Source: GitHub Actions.

name: Download page

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release runs on its tag, and the github-pages environment publishes only
  # from main, so a release asks for a run of this workflow on main instead.
  ask-for-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=30" > site/releases.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
